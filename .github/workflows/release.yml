name: Release

# Push a tag such as v2.0.0-preview.1 to publish every package to NuGet.
#
# Publishing uses NuGet trusted publishing (OIDC), so no long-lived API key is stored.
# One-time setup on nuget.org: add a trusted publishing policy for this repository and
# the workflow file "release.yml", then set the repository variable or secret NUGET_USER
# to the nuget.org profile name that owns the packages.
# Release notes come from docs/releases/<tag>.md, and GitHub appends generated notes.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # request the OIDC token for NuGet trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Test
        run: dotnet test -c Release

      - name: Pack
        run: dotnet pack -c Release -o artifacts /p:ContinuousIntegrationBuild=true

      - name: Get a short-lived NuGet API key
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
