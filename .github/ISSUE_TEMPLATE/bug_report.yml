name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not paste credentials, tokens, webhook URLs, phone numbers or email addresses.** Replace them with placeholders.
  - type: input
    id: version
    attributes:
      label: Package and version
      placeholder: UniversalNotifier.NET.Email.Mailgun 2.0.0-preview.1
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: .NET runtime and OS
      placeholder: .NET 10.0.x on Windows 11
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include the `NotifierResponse` errors (code, kind, message) if there are any.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest code and configuration that shows the problem (secrets removed). A failing test is ideal.
      render: csharp
    validations:
      required: true
